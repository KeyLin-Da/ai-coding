---
name: coding-design-yaml-format
description: 技术方案评审格式规范
version: "1.0"

# 技术方案必须包含以下章节（带上中文描述）
required_sections:
  - overview_diagram   # 整体变更时序图
  - api_scope          # 涉及接口范围
  - sql_changes        # SQL改动内容
  - performance        # 性能考量
  - concurrency        # 并发问题处理
  - impact_analysis    # 影响范围评估
  - unit_test          # 单元测试设计
  - pending_questions  # 待澄清问题

# 各章节说明（可根据需要扩展）
section_descriptions:
  overview_diagram:
    - "使用 Mermaid sequenceDiagram 绘制本次变更的整体交互时序图，放在文档最上方"
    - "参与者包括：前端/客户端、BFF、各微服务、数据库(DB)、缓存(Redis)、消息队列(MQ)等"
    - "时序图必须包含：
      ①请求入口和调用链路 
      ②各步骤的序号标注 
      ③变更点用红色或加粗标识 
      ④涉及的新增/修改接口名称
      ⑤关键异常分支（如缓存未命中、锁获取失败等）"
  api_scope:
    - "注意注意：必须列出新增或修改的接口,包含接口路径、请求参数字段描述说明、入参示例、出参字段描述说明、出参示例、影响级别,涉及redis、MQ，nacos以及接口描述"
    - "注意注意：必须列出接口入参的使用场景"
    - "注意注意：每个接口定义的下方提供各自接口的详细时序图，要求流程图包含序号，标识哪些是变更点、接口参数、返回值、异常处理、涉及表（包含sql）、redis、MQ"
    - "罗列功能点及描述，以及变更原因"
    - "涉及参数和枚举字段，需要列出枚举值及字段中文描述"
    - "出参字段描述规范：
      ① 必须为每个字段提供详细的中文描述，说明字段含义、业务用途、取值范围、是否必填 
      ② List/Array类型字段必须说明子对象结构，包括子对象的字段名、类型、描述、示例 
      ③ 复杂嵌套对象需逐层展开说明，不可仅提供JSON示例"
  impact_analysis: "评估受影响的模块、系统和风险等级"
  performance: "性能指标要求和优化策略"
  concurrency: "并发场景分析和锁策略设计"
  sql_changes:
    - "提供DDL变更内容、索引优化建议、ER图"
    - "如需了解现有表结构，可使用 `coding-database-query` 技能查询：DESCRIBE table_name、SHOW CREATE TABLE table_name、SHOW INDEX FROM table_name"
    - "分析数据分布时，可使用：SELECT COUNT(*)、字段值分布统计等只读查询"
  unit_test:
    - "单元测试用例设计,包括测试类名、测试方法、覆盖场景、Mock对象、预期结果"
    - "如果是查询接口性能优化，需要增加新旧接口性能对比，返回值对比，使用 `coding-junit` 技能"
  pending_questions:
    - "列出设计过程中发现的待澄清问题，包括问题描述、提出原因、影响范围"
    - "格式：序号 | 问题描述 | 提出原因 | 影响范围 | 期望澄清方（产品/架构/业务方）"

# 扩展说明
# - 新增章节：在此文件末尾添加新章节名到 required_sections 列表
# - 新增字段：在 section_descriptions 中说明该章节需要包含的字段
# - 删除章节：从 required_sections 列表中移除对应章节名
